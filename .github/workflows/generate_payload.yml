name: Auto Generate Dual JSON
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 只需要基础写权限提交代码，不需要pages权限
permissions:
  contents: write

# 增加并发控制，防止多次提交互相取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script to generate two json
        run: python3 gen_payloads.py

      - name: Commit json files back to GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add json/payloads_og.json json/payloads_cn.json
          git commit -m "🤖 Auto generate payloads_og & payloads_cn.json" || echo "No changes to commit"
          git push
