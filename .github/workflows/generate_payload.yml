name: Auto Generate payloads.json
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持在github页面手动触发

permissions:
  contents: write # 必须开启，允许action提交文件回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行脚本生成payloads.json
        run: python3 gen_payloads.py

      - name: 提交更新后的json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add json/payloads.json
          git commit -m "🤖 Auto update payloads.json" || echo "No changes to commit"
          git pull
          git push
