name: Auto Generate Dual JSON
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script to generate two json
        run: python3 gen_payloads.py

      - name: Commit json files back to GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add json/github_payloads.json json/china_payloads.json
          git commit -m "🤖 Auto generate github & china payloads.json" || echo "No changes to commit"
          git push
